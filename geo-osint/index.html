<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GEO OSINT - Where Am I?</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --mute:#8b949e; --acc:#2ea043; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; overflow:hidden; }

  /* top bar */
  #bar { position:fixed; top:0; left:0; right:0; height:52px; z-index:20; display:flex; align-items:center; gap:8px; padding:0 12px;
         background:rgba(13,17,23,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(6px); }
  #bar h1 { font-size:16px; margin:0; white-space:nowrap; }
  #bar h1 small { color:var(--mute); font-weight:normal; }
  #bar .sp { flex:1; }
  .chip { font-size:13px; color:var(--mute); white-space:nowrap; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--txt); border-radius:8px; padding:7px 12px; font-size:14px; }
  button:hover { border-color:#58a6ff; }
  button.pri { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }

  /* street view */
  #sv-wrap { position:fixed; top:52px; left:0; right:0; bottom:0; }
  #sv, #sv-js { width:100%; height:100%; border:0; display:block; }
  body.js #mask-tl { display:none; }
  /* masks hide the place-name card and the links that open Google Maps */
  .mask { position:absolute; background:var(--bg); z-index:5; }
  #mask-tl { display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:13px; }
  #mask-tl { top:0; left:0; width:230px; height:84px; border-bottom-right-radius:10px; }
  #mask-br { bottom:0; right:0; width:420px; height:22px; }
  #mask-bl { bottom:0; left:0; width:120px; height:22px; }

  /* hint */
  #hint { position:fixed; top:64px; right:12px; z-index:15; max-width:320px; background:rgba(22,27,34,.95); border:1px solid var(--warn);
          border-radius:10px; padding:10px 14px; font-size:14px; line-height:1.6; display:none; }
  #hint b { color:var(--warn); }

  /* map panel */
  #mapbox { position:fixed; left:14px; bottom:14px; z-index:15; width:300px; height:220px; background:var(--panel); border:1px solid var(--line);
            border-radius:12px; overflow:hidden; transition:width .2s,height .2s; display:flex; flex-direction:column; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #mapbox.big { width:min(640px,calc(100vw - 28px)); height:min(480px,calc(100vh - 90px)); }
  #map { flex:1; }
  #mapbar { display:flex; gap:6px; padding:6px; border-top:1px solid var(--line); }
  #mapbar button { flex:1; padding:8px 6px; }
  #mapbar #grow { flex:0 0 74px; }
  #msg { position:fixed; left:50%; transform:translateX(-50%); bottom:250px; z-index:25; padding:10px 16px; border-radius:10px; font-size:15px;
         background:var(--panel); border:1px solid var(--line); display:none; text-align:center; max-width:90vw; }
  #msg.bad { border-color:var(--bad); } #msg.warn { border-color:var(--warn); }

  /* modal */
  #modal { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:16px; }
  #card { background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(640px,100%); padding:18px; text-align:center; }
  #card h2 { margin:0 0 6px; }
  #rmap { height:300px; border-radius:10px; margin:12px 0; overflow:hidden; }
  .maplibregl-popup-content { color:#111; font-size:13px; padding:4px 8px; }
  #flag { font-family:ui-monospace,Consolas,monospace; background:#0d1117; border:1px dashed var(--acc); color:#7ee787; padding:10px; border-radius:8px;
          direction:ltr; user-select:all; word-break:break-all; }

  #flags { text-align:left; margin:10px 0 0; line-height:1.9; font-family:ui-monospace,Consolas,monospace; font-size:13px; direction:ltr; }
  #intro p { color:var(--mute); line-height:1.7; margin:6px 0; text-align:left; }
  #intro ul { text-align:left; line-height:1.8; padding-left:20px; margin:8px 0 14px; }

  @media (max-width:640px) {
    #bar h1 small, .chip.hide-m { display:none; }
    #mapbox { left:8px; right:8px; bottom:8px; width:auto; height:190px; }
    #mapbox.big { width:auto; height:calc(100vh - 80px); }
    #mask-tl { width:200px; height:80px; }
    #mask-br { width:100%; }
    #msg { bottom:210px; }
    #hint { left:12px; max-width:none; }
  }
</style>
</head>
<body>

<div id="bar">
  <h1>GEO OSINT <small id="stage"></small></h1>
  <span class="sp"></span>
  <span class="chip" id="tries"></span>
  <span class="chip hide-m" id="area"></span>
  <span class="chip hide-m" id="clock">00:00</span>
  <button id="btn-hint">Hint</button>
  <button id="btn-home" title="Go back to the starting point">Back to start</button>
</div>

<div id="sv-wrap">
  <iframe id="sv" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div id="sv-js" style="display:none"></div>
  <div class="mask" id="mask-tl">Hidden - find it yourself</div>
  <div class="mask" id="mask-br"></div>
  <div class="mask" id="mask-bl"></div>
</div>

<div id="hint"></div>

<div id="mapbox">
  <div id="map"></div>
  <div id="mapbar">
    <button id="grow" title="Enlarge / shrink the map">Expand</button>
    <button id="guess" class="pri" disabled>Place a pin on the map</button>
  </div>
</div>

<div id="msg"></div>

<div id="modal">
  <div id="card"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
  // Stage 1 in the clear. Each stage's flag and the next stage are encrypted with
  // a key made from that stage's city name (see tools/build.mjs).
  const FIRST = /*STAGES*/{"n":1,"of":3,"level":"Easy","lat":41.6487,"lng":41.6386,"h":95,"walk":200,"hint":"Don't rush to say the capital... the trees around you don't grow just anywhere in this country.","cc":"300bfc13949304f7981294084fd5bf6e8d96283998a5f194a4c9f544083e1baa","sec":{"s":"i64IGPwobFzH8PhefBne1Q==","i":"6M4xw0J5wnbl9hyN","c":"mKHX22Ae1IOM4gGoI4FDytLrZA+He365qYndtJG3VG+DaqzAmcy3Ekj37ArBJBrVGNBWYGhALHfb6GqvwHtB8UzbcquE7UTXlsBWJ569+kgws5ctQcut2SK8RyI6ubTRWmgIy4leMAt/REp/L5bH+Qyag+QgqeCzRzLjSmp0yTDLR748VbWLQCwDPFKlOtTKU86DcaHckrW5TK2w9kfVljiQ/Z9dNYSSk0fCyGOr3RXzXW0MigCzpcCRitV3apniCuXa0IW250unn8uOLO9N2IFx3gmt8NvyItP5xeEZ7XwTXyOMjdH9HPfpKEEnfMJgEwDyhA5t+/ZxRheaVed4rwghxcyBvYVvR56SnQSbq0SiDVRd5lsxO3Dkqux/HTJ0ArjgePRgs5p8M9ewSW7UOnfHr6uFcgZEtHSuOe2Ksywy5PA4U3ZVfgr7/AfwywbXk4PgM2ED7GNuC14Ys4JBW1IAhWlp0mddpyWdF9DygVv6pjHixWM4WxvRQYcGSD/687ZvtZQgNPfVXYV/JoOE9r7V/nWTY3fIW4l5cF051iswNUKQqzW18rQan/3gdztfeLzPn9LVzYd4jkbHIv/SntbnM9nWnqfZC4SIrNfk11pP0aFJuAIczp1CgWjKtZBTLKu05EIgGs8DrGHC4dS/iChRGgGul6j3pKzSzpSmmtKdh6ANhPQu+7Uhasu8pTm8e18KphisYld3nK+deQDWWL5xibTNc7bk4lVImBZfOYixJehRMj691LF4NFshXXXz3O8A4JkWIKGFvANQu09pPk7HaQprjZKdMg4nQzEmuhAJFZKMHfqMdkVejk1jCXlmAMzjsDgpHlWatzyOBJ9vFtlqCp9vKUVz7yD6qSiWnz8N/G2/s/XRU2Y+XBy9fk/IIxVb+wkiHAB/1UdFHSkDZV4fm02kZn6EYPqmqqdeVHRDhMBY/dqkbMW1DiQhmQ+Sq4AaKpgVoar5UlwZByvEeUTfCqpAcNdHKyDK0V6Bnfih7TAaUZhByuilj/KG2kx8iqgaiQwBQh5ZsfsRaSDCjKEda1T7nroYPIeTl2Am3Kam1BLlYSBSrLUHwtdN+fOLEZkD9Kb0ad305T5kDgZRu/jV2/9yF7LR+TdcgRELWBAtAEoB+9q0al/kkzztLjFE7fDKkJxsN3LUJCsfZmGNhPxZuNbwpzqljKVCHsyH3r73Ejbq6dx5fHJYKaZ1vLRg7+IgdLrOkpuIK5l2mMJfnyd2RXiBaGr/G8Nqbi/eV/ooINR+48CP9/OsFhp9ZJMQemUllB6/3LEv2q5udmhL4Kw=","it":150000}}/*END*/;

  const MAX_TRIES = 3, LOCK_MIN = 2, KEY = "geo-osint-v2";
  const $ = id => document.getElementById(id);
  let st = JSON.parse(localStorage.getItem(KEY) || "null");
  if (!st || !st.cur) st = { cur: FIRST, used: 0, start: Date.now(), flags: [] };
  const save = () => localStorage.setItem(KEY, JSON.stringify(st));
  save();
  const S = () => st.cur;

  // ---- crypto ----
  const ub64 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const sha = async s => Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s))), x => x.toString(16).padStart(2, "0")).join("");
  async function unlock(city) {
    const { s, i, c, it } = S().sec;
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(city)), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub64(s), iterations: it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(i) }, k, ub64(c)))); }
    catch { return null; }
  }

  // ---- street view ----
  // With a Google Maps JavaScript API key: street names hidden and the player is kept inside
  // a small walk area around the start. Without a key: keyless embed (free walking, labels shown).
  // Restrict the key to this site's URL in Google Cloud, since it is visible in the page.
  const GMAPS_KEY = "";
  const svURL = () => `https://maps.google.com/maps?q=&layer=c&cbll=${S().lat},${S().lng}&cbp=11,${S().h},0,0,0&output=svembed&t=${Date.now()}`;
  let pano = null, lastOk = null, homing = false, useJS = false;
  const startPos = () => ({ lat: S().lat, lng: S().lng });
  const gotoStart = () => {
    if (!useJS) { $("sv").src = svURL(); return; }
    homing = true; pano.setPosition(startPos()); pano.setPov({ heading: S().h, pitch: 0 }); pano.setZoom(0);
  };
  function buildPano() {
    pano = new google.maps.StreetViewPanorama($("sv-js"), {
      position: startPos(), pov: { heading: S().h, pitch: 0 }, zoom: 0,
      showRoadLabels: false, addressControl: false, linksControl: true, clickToGo: true,
      fullscreenControl: false, motionTracking: false, motionTrackingControl: false,
      enableCloseButton: false, imageDateControl: false });
    homing = true;
    pano.addListener("position_changed", () => {
      const p = pano.getPosition(); if (!p) return;
      const m = km(p.lat(), p.lng(), S().lat, S().lng) * 1000;
      if (homing) { homing = false; lastOk = pano.getPano(); return; }
      if (m > S().walk && lastOk) { say(`You can't go further. Stay within ${S().walk} m of the start.`, "warn"); pano.setPano(lastOk); }
      else lastOk = pano.getPano();
    });
  }
  function useEmbed() {
    useJS = false; document.body.classList.remove("js");
    $("sv-js").style.display = "none"; $("sv").style.display = "block"; $("area").textContent = "";
    $("sv").src = svURL();
  }
  function startStreet() {
    if (useJS) { $("area").textContent = `Walk area: ${S().walk} m`; gotoStart(); return; }
    if (!GMAPS_KEY) return useEmbed();
    useJS = true; document.body.classList.add("js");
    $("sv").style.display = "none"; $("sv").removeAttribute("src"); $("sv-js").style.display = "block";
    $("area").textContent = `Walk area: ${S().walk} m`;
    window.gm_authFailure = () => { pano = null; useEmbed(); };
    window.__gmReady = buildPano;
    const sc = document.createElement("script");
    sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GMAPS_KEY)}&v=weekly&loading=async&callback=__gmReady`;
    sc.async = true; sc.onerror = useEmbed; document.head.appendChild(sc);
  }
  $("btn-home").onclick = gotoStart;
  $("btn-hint").onclick = () => { const h = $("hint"); h.style.display = h.style.display === "block" ? "none" : "block"; };

  // ---- timer / tries ----
  const fmt = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  const tick = () => { $("clock").textContent = fmt((st.end || Date.now()) - st.start); };
  setInterval(tick, 1000);
  const showTries = () => { $("tries").textContent = `Attempts: ${Math.max(0, MAX_TRIES - st.used)}/${MAX_TRIES}`; };

  // ---- maps: OpenFreeMap tiles, labels forced to English (or Latin letters), no street names ----
  const STYLE = "https://tiles.openfreemap.org/styles/liberty";
  const english = m => m.on("style.load", () => {
    for (const l of m.getStyle().layers)
      if (l.type === "symbol" && m.getLayoutProperty(l.id, "text-field"))
        m.setLayoutProperty(l.id, "text-field", ["coalesce", ["get", "name:en"], ["get", "name:latin"], ""]);
    // no street names, house numbers or points of interest (bus stops carry street names)
    for (const l of m.getStyle().layers)
      if (["transportation_name", "housenumber", "poi"].includes(l["source-layer"])) m.setLayoutProperty(l.id, "visibility", "none");
  });
  const makeMap = (el, opts = {}) => {
    const m = new maplibregl.Map({ container: el, style: STYLE, center: [20, 25], zoom: 0.4, attributionControl: { compact: true }, dragRotate: false, ...opts });
    m.touchZoomRotate.disableRotation(); m.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
    m.on("load", () => m.getContainer().querySelector(".maplibregl-ctrl-attrib")?.classList.remove("maplibregl-compact-show"));
    english(m); return m;
  };

  // ---- guess map ----
  const map = makeMap("map");
  let pin = null;
  map.on("click", e => {
    if (pin) pin.setLngLat(e.lngLat); else pin = new maplibregl.Marker({ color: "#3b82f6" }).setLngLat(e.lngLat).addTo(map);
    $("guess").disabled = false; $("guess").textContent = "Confirm guess";
  });
  $("grow").onclick = () => { const b = $("mapbox").classList.toggle("big"); $("grow").textContent = b ? "Shrink" : "Expand"; setTimeout(() => map.resize(), 250); };

  function loadStage() {
    const s = S();
    $("stage").textContent = `- Stage ${s.n}/${s.of} (${s.level})`;
    $("hint").innerHTML = `<b>Hint:</b> ${s.hint}`; $("hint").style.display = "none";
    startStreet();
    if (pin) { pin.remove(); pin = null; }
    map.jumpTo({ center: [20, 25], zoom: 0.4 });
    $("guess").disabled = true; $("guess").textContent = "Place a pin on the map";
    showTries(); tick();
  }

  // ---- helpers ----
  const km = (a, b, c, d) => {
    const R = 6371, r = x => x * Math.PI / 180;
    const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  let msgT;
  const say = (html, cls = "") => {
    const m = $("msg"); m.className = cls; m.innerHTML = html; m.style.display = "block";
    clearTimeout(msgT); msgT = setTimeout(() => m.style.display = "none", 6000);
  };
  async function where(lat, lng) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=10&accept-language=en`);
      const a = (await r.json()).address || {};
      const names = [a.city, a.town, a.village, a.municipality, a.county].filter(Boolean);
      return { cc: a.country_code || "", names, country: a.country || "" };
    } catch { return null; }
  }
  const lockedFor = () => st.lockUntil ? Math.max(0, st.lockUntil - Date.now()) : 0;

  // ---- guessing ----
  let busy = false;
  $("guess").onclick = async () => {
    if (!pin || st.won || busy) return;
    const left = lockedFor();
    if (left) return say(`Out of attempts. Wait ${fmt(left)} and try again.`, "bad");
    if (st.lockUntil) { st.used = 0; st.lockUntil = 0; }

    busy = true;
    const g = pin.getLngLat().wrap();
    $("guess").disabled = true; $("guess").textContent = "Checking...";
    const info = await where(g.lat, g.lng);
    let opened = null;
    for (const n of (info ? info.names : [])) if ((opened = await unlock(n))) break;
    busy = false;
    $("guess").disabled = false; $("guess").textContent = "Confirm guess";

    if (opened) {
      st.won = { flag: opened.flag, next: opened.next, lat: g.lat, lng: g.lng };
      st.flags.push({ n: S().n, flag: opened.flag });
      st.end = Date.now(); save(); tick();
      return showWin();
    }
    if (!info) return say("Couldn't check that spot (map service didn't answer). Try again - this attempt didn't count.", "warn");

    st.used++;
    if (st.used >= MAX_TRIES) st.lockUntil = Date.now() + LOCK_MIN * 60000;
    save(); showTries();

    const rest = MAX_TRIES - st.used;
    const tail = rest > 0 ? `<br><small>${rest} attempt${rest > 1 ? "s" : ""} left</small>` : `<br><small>Out of attempts - come back in ${LOCK_MIN} minutes</small>`;
    if ((await sha("geo-osint:" + info.cc)) === S().cc)
      say(`Right country! But <b>${info.names[0] || "that spot"}</b> is not the city. You need the exact city.${tail}`, "warn");
    else
      say(`Wrong country${info.country ? ` (${info.country})` : ""}. Look closer at the details around you.${tail}`, "bad");
  };

  function showWin() {
    const w = st.won, s = S();
    const dist = km(w.lat, w.lng, s.lat, s.lng);
    const level = dist <= 0.3 ? "Same street!" : dist <= 1.5 ? "Right neighborhood" : "Right city";
    const last = !w.next;
    $("card").innerHTML = `
      <h2>${last ? `All ${s.of} stages cleared!` : `Stage ${s.n} cleared!`}</h2>
      <div>${level} - Distance: <b>${dist < 1 ? Math.round(dist * 1000) + " m" : dist.toFixed(2) + " km"}</b> &middot; Time: <b>${fmt(st.end - st.start)}</b></div>
      <div id="rmap"></div>
      <div style="margin-bottom:6px;color:var(--mute)">Flag:</div>
      <div id="flag">${w.flag}</div>
      ${last ? `<div id="flags">${st.flags.map(f => `Stage ${f.n}: ${f.flag}`).join("<br>")}</div>` : ""}
      <div style="margin-top:14px">${last
        ? `<button id="again">Play again</button>`
        : `<button class="pri" id="next">Next stage</button>`}</div>`;
    $("modal").style.display = "flex";
    if (last) $("again").onclick = () => { localStorage.removeItem(KEY); location.reload(); };
    else $("next").onclick = () => {
      st.cur = w.next; st.won = null; st.used = 0; st.lockUntil = 0; st.end = 0; st.start = Date.now(); save();
      $("modal").style.display = "none"; loadStage();
    };
    const t = [s.lng, s.lat], u = [w.lng, w.lat];
    const rm = makeMap("rmap", { bounds: new maplibregl.LngLatBounds(t, t).extend(u), fitBoundsOptions: { padding: 60, maxZoom: 15 } });
    const tag = txt => new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 30 }).setText(txt);
    new maplibregl.Marker({ color: "#3b82f6" }).setLngLat(u).setPopup(tag("Your guess")).addTo(rm);
    const ok = new maplibregl.Marker({ color: "#2ea043" }).setLngLat(t).setPopup(tag("Correct spot")).addTo(rm);
    rm.on("load", () => {
      ok.togglePopup();
      rm.addSource("line", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: [u, t] } } });
      rm.addLayer({ id: "line", type: "line", source: "line", paint: { "line-color": "#d29922", "line-width": 3, "line-dasharray": [2, 2] } });
    });
  }

  // ---- intro / resume ----
  loadStage();
  if (st.won) { showWin(); return; }
  if (!st.seen) {
    $("card").innerHTML = `<div id="intro">
      <h2>GEO OSINT - Where am I?</h2>
      <p>You've been dropped somewhere on planet Earth. All you have is your eyes.</p>
      <ul>
        <li>Walk down the street (click the arrows or drag the view) and look around.</li>
        <li>Look for any clue: the language on signs, trees, architecture, cars...</li>
        <li>When you know, open the map below, place a pin, and confirm.</li>
        <li>You must pin at least the right <b>city</b> - the country alone is not enough.</li>
        <li>${FIRST.of} stages, each harder than the last. Solve one to unlock the next.</li>
        <li>You get ${MAX_TRIES} attempts per stage. There's a hint button at the top if you get stuck.</li>
      </ul>
      <button class="pri" id="go">Start</button></div>`;
    $("modal").style.display = "flex";
    $("go").onclick = () => { st.seen = true; st.start = Date.now(); save(); $("modal").style.display = "none"; };
  }
})();
</script>
</body>
</html>
